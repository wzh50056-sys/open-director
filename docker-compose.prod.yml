name: open-director

x-app: &app
  init: true
  restart: unless-stopped
  env_file:
    - ${ENV_FILE:-.env.prod}
  networks:
    - app

services:
  migrate:
    <<: *app
    image: open-director-migrate:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate-runner
    restart: "no"

  web:
    <<: *app
    image: open-director-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runner
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    <<: *app
    image: open-director-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: render-runner
    command: ["xvfb-run", "-a", "-s", "-ac -screen 0 1280x1024x24", "pnpm", "-C", "/app/apps/render", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 2m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app

networks:
  app:
    driver: bridge
